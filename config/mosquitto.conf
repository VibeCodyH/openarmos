# Development-friendly local MQTT bus.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Production hardening:
# - set allow_anonymous false
# - add password_file /mosquitto/config/passwd
# - restrict port 1883 to the trusted LAN or remove the host port mapping
# - use a TLS listener when MQTT crosses an untrusted network
